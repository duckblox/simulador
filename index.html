<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  🚀 COCKPIT GALÁCTICO — EDIÇÃO APRENDIZ                      ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  Como usar:  1) Abra este arquivo no VS Code ou Bloco de     ║
  ║                 Notas.  2) Mude um número.  3) Salve (Ctrl+S)║
  ║                 4) Aperte F5 no navegador.  Viu a mudança?   ║
  ║                                                              ║
  ║  Um site é feito de 3 partes:                                ║
  ║   HTML = o esqueleto (o que existe na página)                ║
  ║   CSS  = a roupa (cores, tamanhos)                           ║
  ║   JavaScript = o cérebro (o que acontece, o jogo!)           ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Galáctico — Edição Aprendiz</title>

<style>
  /* CSS: a "roupa" da página. Aqui deixamos tudo preto e em tela cheia. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }  /* o canvas é a "folha de desenho" do jogo */
  #inicio { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,8,.88); text-align: center; padding: 20px; }
  #inicio[hidden] { display: none; }   /* quando tem "hidden", a tela de início some */
  #botaoIniciar { margin-top: 16px; font: 700 20px system-ui; padding: 14px 34px; background: #00ffcc; border: 0; border-radius: 12px; cursor: pointer; }
</style>
</head>

<body>
<!-- HTML: o esqueleto. Só temos 2 coisas: a folha de desenho e a tela de início. -->
<canvas id="tela"></canvas>
<div id="inicio">
  <h1>🚀 COCKPIT GALÁCTICO</h1>
  <p>Mire com o mouse. Clique para atirar.<br>Arraste a alavanca e os botões do painel!</p>
  <button id="botaoIniciar">Decolar</button>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   📚 PALAVRAS QUE VOCÊ VAI ENCONTRAR
   • variável  = uma caixinha com nome que guarda um valor (let pontos = 0)
   • constante = caixinha que não troca de nome (const)
   • função    = uma receita com nome. Você "chama" ela quando quiser
   • if        = "se isso for verdade, faça aquilo"
   • for       = repetir algo várias vezes
   • loop      = a função que roda ~60 vezes por segundo (cada vez = 1 quadro)
   • canvas    = a folha onde desenhamos tudo
   ════════════════════════════════════════════════════════════════ */


/* ════════════════════════════════════════════════════════════════
   1️⃣  CONFIGURAÇÕES — 🎯 COMECE MEXENDO AQUI!
   Todos os números "mexíveis" do jogo estão juntos neste bloco.
   ════════════════════════════════════════════════════════════════ */
const CONFIG = {
  velocidadeInimigo: 5,        // 🎯 Tente 2 (lento) ou 12 (rápido!)
  maxInimigos: 4,              // 🎯 Quantas naves inimigas ao mesmo tempo
  tamanhoInimigo: 60,          // 🎯 Tente 150 para inimigos gigantes
  corInimigo: 350,             // 🎯 Cor de 0 a 360: 0=vermelho 120=verde 240=azul 300=rosa
  corDoPainel: '#00ffcc',      // 🎯 Troque por '#ff66cc' ou '#ffd23f'
  numeroDeEstrelas: 400,       // 🎯 Tente 50 (vazio) ou 1500 (cheio)
  danoDoEscudo: 0.18,          // 🎯 Tente 0 para ser invencível
  recargaDoTiro: 230,          // 🎯 Milissegundos entre tiros. Tente 80!
  // 🎯 As falas do computador de bordo. Escreva o que quiser!
  falas: {
    inicio:    'Sistemas online. Bem-vindo, piloto.',
    alerta:    'Alerta. Inimigo detectado à frente.',
    travado:   'Alvo travado.',
    destruido: 'Inimigo destruído.',
    atingido:  'Escudo atingido.',
    missao:    'Missão cumprida.'
  }
};


/* ════════════════════════════════════════════════════════════════
   2️⃣  PREPARAÇÃO — pegar a folha de desenho e medir a tela
   ════════════════════════════════════════════════════════════════ */
const tela = document.getElementById('tela');   // procura no HTML o elemento com id="tela"
const pincel = tela.getContext('2d');           // o "pincel": tudo que desenhamos usa ele

// Variáveis de tamanho (preenchidas na função ajustaTela)
let largura, altura;     // tamanho da janela
let escala;              // "zoom" do painel (muda conforme o tamanho da tela)
let alturaPainel;        // altura da parte de baixo (o painel da nave)
let alturaVisao;         // altura da janela da nave (a parte do espaço)
let centroX, centroY;    // meio da visão (de onde as coisas "vêm")
let foco;                // número que cria o efeito 3D (explicado na seção 6)

function ajustaTela() {
  largura = window.innerWidth;
  altura = window.innerHeight;
  tela.width = largura;
  tela.height = altura;
  escala = Math.min(largura / 1000, altura * 0.4 / 260);  // o painel foi desenhado numa grade de 1000 x 260
  alturaPainel = 260 * escala;
  alturaVisao = altura - alturaPainel;
  centroX = largura / 2;
  centroY = alturaVisao / 2;
  foco = Math.max(largura, alturaVisao) * 0.62;
}
window.addEventListener('resize', ajustaTela);  // evento: "quando a janela mudar de tamanho, rode ajustaTela"
ajustaTela();

// Converte uma posição da "grade do painel" (0 a 1000) para pixels reais da tela.
const px = (x) => largura / 2 + (x - 500) * escala;
const py = (y) => alturaVisao + y * escala;


/* ════════════════════════════════════════════════════════════════
   3️⃣  ESTADO DO JOGO — tudo que muda enquanto você joga
   ════════════════════════════════════════════════════════════════ */
const nave = {
  aceleracao: 0.35,     // onde você deixou a alavanca (0 a 1)
  velocidade: 0.35,     // velocidade real (alcança a aceleração aos poucos, como uma nave de verdade)
  escudo: 1,            // 1 = cheio, 0 = vazio
  energia: 1,           // gasta ao atirar, recarrega sozinha
  botaoEscudo: 0.6,     // botão giratório: quão rápido o escudo se recupera
  botaoSensor: 0.5,     // botão giratório: alcance do radar e tamanho da mira
  luzLigada: true,      // interruptor da luz da cabine
  luz: 1,               // brilho atual da luz (suaviza ao ligar/desligar)
  vozLigada: true,
  somLigado: true
};
let camX = 0, camY = 0;      // para onde a nave está "olhando"
let rumo = 0;                // graus da bússola (0 = Norte)
let pontos = 0, abates = 0, missao = 1;
let tempo = 0;               // conta quadros desde o início (usado em animações)
let ultimoTiro = 0, raioTiro = 0, piscaVermelho = 0, atirando = false;
let alvoTravado = null;      // o inimigo dentro da mira (ou null = nenhum)
let legenda = '', tempoLegenda = 0, jogando = false;

const mira = { x: window.innerWidth / 2, y: window.innerHeight * 0.3 };
const estrelas = [];   // lista (array) de estrelas
const inimigos = [];   // lista de naves inimigas
const faiscas = [];    // pedacinhos das explosões
const galaxias = [];   // galáxias espirais ao fundo

const aleatorio = Math.random;  // sorteia número entre 0 e 1


/* ════════════════════════════════════════════════════════════════
   4️⃣  SOM E VOZ
   ════════════════════════════════════════════════════════════════ */
let audio;  // o "sistema de som" do navegador (só liga depois de um clique)

// Cria um bipe: sobe ou desce de uma frequência (a) até outra (b).
function bipe(a, b, duracao, tipo, volume) {
  if (!nave.somLigado || !audio) return;          // se o som estiver desligado, para aqui
  const osc = audio.createOscillator();           // gerador de onda sonora
  const vol = audio.createGain();                 // controle de volume
  const agora = audio.currentTime;
  osc.type = tipo;                                // 'sine' suave, 'square' retrô, 'sawtooth' laser
  osc.frequency.setValueAtTime(a, agora);
  osc.frequency.exponentialRampToValueAtTime(b, agora + duracao);
  vol.gain.setValueAtTime(volume, agora);
  vol.gain.exponentialRampToValueAtTime(0.0001, agora + duracao);  // some devagar
  osc.connect(vol); vol.connect(audio.destination);
  osc.start(agora); osc.stop(agora + duracao);
}

let ultimaFala = 0;
// O computador de bordo fala (e mostra legenda na tela).
function falar(texto, forcar) {
  const agora = performance.now();
  if (!forcar && agora - ultimaFala < 3500) return;   // evita falar sem parar
  ultimaFala = agora;
  legenda = texto; tempoLegenda = 200;
  if (!nave.vozLigada || !('speechSynthesis' in window)) return;
  const fala = new SpeechSynthesisUtterance(texto);
  fala.lang = 'pt-BR';
  fala.pitch = 0.35;     // 🎯 Tom da voz: 0 = grave, 2 = agudo
  fala.rate = 0.9;       // 🎯 Velocidade: 0.5 = lenta, 2 = rápida
  speechSynthesis.cancel();
  speechSynthesis.speak(fala);
}


/* ════════════════════════════════════════════════════════════════
   5️⃣  CRIANDO O UNIVERSO — estrelas e galáxias
   ════════════════════════════════════════════════════════════════ */
// Cada estrela tem posição x, y e distância z (quanto maior o z, mais longe).
function novaEstrela(z) {
  return { x: aleatorio() * 4000 - 2000, y: aleatorio() * 4000 - 2000, z: z };
}
for (let i = 0; i < CONFIG.numeroDeEstrelas; i++) estrelas.push(novaEstrela(aleatorio() * 2970 + 30));

// Desenha UMA galáxia numa folha pequena, uma vez só. Depois só copiamos a imagem (rápido!).
function criaGalaxia(matiz) {
  const folha = document.createElement('canvas');
  folha.width = folha.height = 256;
  const g = folha.getContext('2d');
  const brilho = g.createRadialGradient(128, 128, 0, 128, 128, 128);   // degradê circular
  brilho.addColorStop(0, `hsla(${matiz},90%,85%,.9)`);
  brilho.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = brilho; g.fillRect(0, 0, 256, 256);
  // Os 2 braços da espiral: cada ponto gira (ângulo) e se afasta (raio) ao mesmo tempo
  for (let i = 0; i < 500; i++) {
    const angulo = aleatorio() * 13, raio = angulo * 9;
    for (const lado of [0, Math.PI]) {
      g.fillStyle = 'rgba(255,255,255,.7)';
      g.fillRect(128 + Math.cos(angulo + lado) * raio + aleatorio() * 8 - 4,
                 128 + Math.sin(angulo + lado) * raio + aleatorio() * 8 - 4, 1.5, 1.5);
    }
  }
  return folha;
}
[210, 290, 30, 170].forEach((matiz) => galaxias.push({
  x: aleatorio() * 8000 - 4000, y: aleatorio() * 4000 - 2000, z: 2500 + aleatorio() * 4000,
  tamanho: 1300 + aleatorio() * 900, giro: aleatorio() * 3, imagem: criaGalaxia(matiz)
}));


/* ════════════════════════════════════════════════════════════════
   6️⃣  A MÁGICA DO 3D (explicação)
   A tela é plana, mas parece 3D com uma regra simples:
       posição na tela = centro + (posição ÷ distância) × foco
   Quanto MAIOR a distância z, mais perto do centro e menor o objeto.
   Quando a nave inimiga se aproxima (z diminui), ela cresce e se afasta
   do centro. É assim que seu cérebro "enxerga" profundidade!
   ════════════════════════════════════════════════════════════════ */
function projeta(x, y, z) {
  return [centroX + (x - camX) * foco / z, centroY + (y - camY) * foco / z];
}
// "Dá a volta": faz o espaço parecer infinito (se a estrela sai de um lado, volta pelo outro).
const volta = (v, m) => ((v + m / 2) % m + m) % m - m / 2;


/* ════════════════════════════════════════════════════════════════
   7️⃣  AS REGRAS DO JOGO — atualiza tudo a cada quadro
   ════════════════════════════════════════════════════════════════ */
function atualiza(dt) {   // dt = quanto tempo passou (1 = um quadro normal de 60 por segundo)
  tempo += dt;
  nave.velocidade += (nave.aceleracao - nave.velocidade) * 0.04 * dt;       // velocidade "persegue" a alavanca
  nave.luz += ((nave.luzLigada ? 1 : 0) - nave.luz) * 0.1 * dt;             // luz acende/apaga suave
  const rapidez = 3 + nave.velocidade * 38;                                  // quão rápido as estrelas passam

  // Direção: quanto mais longe do centro está a mira, mais a nave vira
  const viraX = (mira.x - centroX) / centroX, viraY = (mira.y - centroY) / centroY;
  camX += viraX * 7 * dt; camY += viraY * 4 * dt;
  rumo = (rumo + viraX * 0.5 * dt + 360) % 360;

  // Estrelas vêm na sua direção (z diminui). Se passam de você, voltam para o fundo.
  for (const e of estrelas) {
    e.z -= rapidez * dt;
    if (e.z < 30) { e.z = 3000; e.x = aleatorio() * 4000 - 2000 + camX; e.y = aleatorio() * 4000 - 2000 + camY; }
  }
  for (const g of galaxias) {   // galáxias: iguais, só que bem mais lentas
    g.z -= (0.4 + nave.velocidade * 3) * dt;
    if (g.z < 800) { g.z = 6500; g.x = camX + aleatorio() * 6000 - 3000; g.y = camY + aleatorio() * 3000 - 1500; }
  }

  // Nascimento de inimigos: só se ainda não chegou no máximo (if) e com um pouco de sorte
  if (inimigos.length < CONFIG.maxInimigos && aleatorio() < 0.012 * dt) {
    inimigos.push({ x: camX + (aleatorio() - 0.5) * 1800, y: camY + (aleatorio() - 0.5) * 900, z: 3200, fase: aleatorio() * 6 });
    falar(CONFIG.falas.alerta);
  }

  // Movimento dos inimigos (de trás para frente, porque podemos remover itens da lista)
  for (let i = inimigos.length - 1; i >= 0; i--) {
    const ini = inimigos[i];
    ini.z -= CONFIG.velocidadeInimigo * (0.6 + nave.velocidade * 0.9) * dt;   // aproxima
    ini.x += Math.sin(tempo / 50 + ini.fase) * 3 * dt;                        // balança de leve (seno = onda)
    if (ini.z < 110) {                                                        // chegou perto demais: bateu no escudo
      inimigos.splice(i, 1);                                                  // remove da lista
      nave.escudo -= CONFIG.danoDoEscudo; piscaVermelho = 1;
      bipe(90, 40, 0.4, 'triangle', 0.15); falar(CONFIG.falas.atingido);
      if (nave.escudo <= 0) nave.escudo = 1;                                  // sem "game over": o escudo reinicia
    }
  }

  // Travar o alvo: o inimigo mais perto que estiver dentro do círculo da mira
  const raioMira = 28 + nave.botaoSensor * 50;
  const alvoAntigo = alvoTravado;
  alvoTravado = null;
  let maisPerto = Infinity;
  for (const ini of inimigos) {
    const [sx, sy] = projeta(ini.x, ini.y, ini.z);
    const tam = CONFIG.tamanhoInimigo * foco / ini.z;
    if (Math.hypot(sx - mira.x, sy - mira.y) < tam * 0.7 + raioMira && ini.z < maisPerto) {   // hypot = distância entre 2 pontos
      maisPerto = ini.z; alvoTravado = { ini, sx, sy, tam };
    }
  }
  if (alvoTravado && (!alvoAntigo || alvoAntigo.ini !== alvoTravado.ini)) { bipe(1400, 1400, 0.08, 'square', 0.04); falar(CONFIG.falas.travado); }

  for (let i = faiscas.length - 1; i >= 0; i--) {   // as faíscas da explosão se espalham e somem
    const f = faiscas[i];
    f.x += f.vx * dt; f.y += f.vy * dt; f.vida -= 0.025 * dt;
    if (f.vida <= 0) faiscas.splice(i, 1);
  }

  nave.energia = Math.min(1, nave.energia + 0.004 * dt);                                  // recarrega (Math.min = "não passa de 1")
  nave.escudo = Math.min(1, nave.escudo + (0.0002 + nave.botaoEscudo * 0.0012) * dt);     // o botão controla a recuperação
  if (atirando) atira();
  if (piscaVermelho > 0) piscaVermelho -= 0.03 * dt;
  if (raioTiro > 0) raioTiro -= dt;
  if (tempoLegenda > 0) tempoLegenda -= dt;
}

function atira() {
  const agora = performance.now();
  if (!jogando || agora - ultimoTiro < CONFIG.recargaDoTiro) return;   // ainda recarregando
  if (nave.energia < 0.07) { falar('Energia baixa.'); return; }
  ultimoTiro = agora; nave.energia -= 0.07; raioTiro = 7;
  bipe(900, 180, 0.16, 'sawtooth', 0.06);
  if (!alvoTravado) return;                                            // atirou no vazio
  inimigos.splice(inimigos.indexOf(alvoTravado.ini), 1);               // acertou! remove o inimigo
  for (let i = 0; i < 30; i++) {                                       // cria 30 faíscas em direções aleatórias
    const ang = aleatorio() * 6.28, vel = aleatorio() * 6 + 1;
    faiscas.push({ x: alvoTravado.sx, y: alvoTravado.sy, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, vida: 1, cor: i % 3 ? '#ffb347' : '#ff4466' });
  }
  bipe(170, 35, 0.6, 'triangle', 0.2);
  pontos += 50; abates += 1; alvoTravado = null;
  if (abates >= 6 + missao * 2) { missao += 1; abates = 0; falar(CONFIG.falas.missao, true); }   // passou de fase!
  else falar(CONFIG.falas.destruido);
}


/* ════════════════════════════════════════════════════════════════
   8️⃣  DESENHO — pintar tudo na tela, quadro por quadro
   Ordem importa: o que desenhamos DEPOIS fica POR CIMA.
   ════════════════════════════════════════════════════════════════ */

// ─── 8.1 O ESPAÇO (fundo, galáxias, estrelas, inimigos, mira) ───
function desenhaNaveInimiga(x, y, tam, ini) {
  pincel.save();                                   // save/restore: guarda e devolve as configurações do pincel
  pincel.translate(x, y);                          // move o "ponto zero" para a posição da nave
  pincel.rotate(Math.sin(tempo / 40 + ini.fase) * 0.3);   // inclina de lado (voo de verdade!)
  pincel.scale(tam, tam);                          // todas as medidas abaixo são frações do tamanho
  const cor = `hsl(${CONFIG.corInimigo},100%,62%)`;
  pincel.shadowColor = cor; pincel.shadowBlur = 18;        // brilho neon
  pincel.fillStyle = '#232842'; pincel.strokeStyle = cor; pincel.lineWidth = 2 / tam;
  pincel.beginPath();                              // desenhar um polígono ligando pontos: o "corpo"
  pincel.moveTo(0, -0.35); pincel.lineTo(0.6, 0.3); pincel.lineTo(0.25, 0.18);
  pincel.lineTo(0, 0.3); pincel.lineTo(-0.25, 0.18); pincel.lineTo(-0.6, 0.3);
  pincel.closePath(); pincel.fill(); pincel.stroke();
  pincel.fillStyle = '#ffe28a';                    // as duas luzes dos motores
  for (const lado of [-0.2, 0.2]) { pincel.beginPath(); pincel.arc(lado, 0.22, 0.05, 0, 6.3); pincel.fill(); }
  pincel.restore();
}

function desenhaEspaco() {
  pincel.fillStyle = '#020207'; pincel.fillRect(0, 0, largura, altura);          // fundo quase preto

  for (const g of galaxias) {                                                    // galáxias
    const sx = centroX + volta(g.x - camX, 8000) * foco / g.z;
    const sy = centroY + volta(g.y - camY, 4000) * foco / g.z;
    const tam = g.tamanho * foco / g.z;
    pincel.save();
    pincel.globalAlpha = Math.min(1, (g.z - 800) / 700);                         // vai sumindo quando chega perto
    pincel.translate(sx, sy); pincel.rotate(g.giro); pincel.scale(1, 0.55);      // achatada = inclinada
    pincel.drawImage(g.imagem, -tam / 2, -tam / 2, tam, tam);
    pincel.restore();
  }

  const rapidez = 3 + nave.velocidade * 38;
  pincel.lineCap = 'round';
  for (const e of estrelas) {                                                    // estrelas viram RISCOS de luz
    const dx = volta(e.x - camX, 4000), dy = volta(e.y - camY, 4000);
    const x = centroX + dx * foco / e.z, y = centroY + dy * foco / e.z;
    const brilho = 1 - e.z / 3000;                                               // mais perto = mais brilhante
    pincel.strokeStyle = `rgba(255,255,255,${0.25 + brilho * 0.75})`;
    pincel.lineWidth = 0.5 + brilho * 1.8;
    const zAntes = e.z + rapidez * 1.4;                                          // onde a estrela estava um instante atrás
    pincel.beginPath();
    pincel.moveTo(centroX + dx * foco / zAntes, centroY + dy * foco / zAntes);   // o risco liga "antes"...
    pincel.lineTo(x, y);                                                         // ...até "agora"
    pincel.stroke();
  }

  // Inimigos: os mais longe primeiro (sort), para os mais perto ficarem por cima
  [...inimigos].sort((a, b) => b.z - a.z).forEach((ini) => {
    const [sx, sy] = projeta(ini.x, ini.y, ini.z);
    desenhaNaveInimiga(sx, sy, CONFIG.tamanhoInimigo * foco / ini.z, ini);
  });

  if (alvoTravado) {                                                             // colchetes vermelhos de "alvo travado"
    const { sx, sy, tam } = alvoTravado, k = tam * 0.55;
    pincel.strokeStyle = '#ff3355'; pincel.lineWidth = 2.5; pincel.beginPath();
    for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      pincel.moveTo(sx + a * k, sy + b * k * 0.6); pincel.lineTo(sx + a * k, sy + b * k); pincel.lineTo(sx + a * k * 0.6, sy + b * k);
    }
    pincel.stroke();
    pincel.fillStyle = '#ff3355'; pincel.font = '12px monospace'; pincel.textAlign = 'center';
    pincel.fillText('DIST ' + Math.round(alvoTravado.ini.z) + ' m', sx, sy + k + 18);
  }

  for (const f of faiscas) { pincel.globalAlpha = Math.max(0, f.vida); pincel.fillStyle = f.cor; pincel.fillRect(f.x, f.y, 4, 4); }
  pincel.globalAlpha = 1;

  if (raioTiro > 0) {                                                            // lasers saem dos cantos da cabine
    const alvoX = alvoTravado ? alvoTravado.sx : mira.x, alvoY = alvoTravado ? alvoTravado.sy : mira.y;
    pincel.save(); pincel.strokeStyle = '#5ff'; pincel.shadowColor = '#0ff'; pincel.shadowBlur = 14; pincel.lineWidth = 4;
    pincel.beginPath();
    pincel.moveTo(largura * 0.14, alturaVisao); pincel.lineTo(alvoX, alvoY);
    pincel.moveTo(largura * 0.86, alturaVisao); pincel.lineTo(alvoX, alvoY);
    pincel.stroke(); pincel.restore();
  }

  const r = 28 + nave.botaoSensor * 50;                                          // a mira (círculo + 4 tracinhos)
  pincel.strokeStyle = alvoTravado ? '#ff3355' : CONFIG.corDoPainel; pincel.lineWidth = 1.5;
  pincel.beginPath(); pincel.arc(mira.x, mira.y, r, 0, 6.3);
  pincel.moveTo(mira.x - r - 8, mira.y); pincel.lineTo(mira.x - r + 10, mira.y);
  pincel.moveTo(mira.x + r - 10, mira.y); pincel.lineTo(mira.x + r + 8, mira.y);
  pincel.moveTo(mira.x, mira.y - r - 8); pincel.lineTo(mira.x, mira.y - r + 10);
  pincel.moveTo(mira.x, mira.y + r - 10); pincel.lineTo(mira.x, mira.y + r + 8);
  pincel.stroke();

  if (piscaVermelho > 0) { pincel.fillStyle = `rgba(255,60,80,${piscaVermelho * 0.22})`; pincel.fillRect(0, 0, largura, alturaVisao); }  // tela avermelha suave ao ser atingido
}

// ─── 8.2 FERRAMENTAS DO PAINEL (pequenas funções reaproveitadas) ───
function texto(t, x, y, tamanho, cor, alinha) {            // escreve um texto na grade do painel
  pincel.fillStyle = cor; pincel.font = `${tamanho * escala}px monospace`; pincel.textAlign = alinha || 'center';
  pincel.fillText(t, px(x), py(y));
}
function moldura(x, y, r) {                                // o aro metálico redondo de um instrumento
  pincel.fillStyle = '#080a12'; pincel.strokeStyle = '#4a5378'; pincel.lineWidth = 4 * escala;
  pincel.beginPath(); pincel.arc(px(x), py(y), r * escala, 0, 6.3); pincel.fill(); pincel.stroke();
}
function lampada(x, y, ligada, cor) {                      // uma luzinha que acende e apaga
  pincel.save(); pincel.fillStyle = ligada ? cor : '#2a2d3d';
  if (ligada) { pincel.shadowColor = cor; pincel.shadowBlur = 12 * escala; }
  pincel.beginPath(); pincel.arc(px(x), py(y), 6 * escala, 0, 6.3); pincel.fill(); pincel.restore();
}
function barra(x, y, largBarra, valor, cor, nome) {        // barra de nível (escudo, energia). valor vai de 0 a 1
  pincel.fillStyle = '#07090f'; pincel.strokeStyle = '#4a5378'; pincel.lineWidth = 2;
  pincel.beginPath(); pincel.roundRect(px(x), py(y), largBarra * escala, 14 * escala, 7 * escala); pincel.fill(); pincel.stroke();
  pincel.fillStyle = cor; pincel.beginPath(); pincel.roundRect(px(x), py(y), Math.max(2, largBarra * escala * valor), 14 * escala, 7 * escala); pincel.fill();
  texto(nome, x, y - 4, 9, '#9aa3c7', 'left');
}

// ─── 8.3 OS INSTRUMENTOS ───
function desenhaVelocimetro() {
  const x = 150, y = 140, r = 85;
  moldura(x, y, r);
  pincel.save(); pincel.translate(px(x), py(y)); pincel.lineCap = 'round';
  for (let i = 0; i <= 10; i++) {                           // 11 tracinhos em arco (de 135° a 405°)
    const a = 0.75 * Math.PI + 1.5 * Math.PI * i / 10;
    pincel.strokeStyle = i > 8 ? '#ff4466' : CONFIG.corDoPainel;   // os 2 últimos ficam vermelhos (zona de perigo)
    pincel.lineWidth = 2.5 * escala; pincel.beginPath();
    pincel.moveTo(Math.cos(a) * r * escala * 0.78, Math.sin(a) * r * escala * 0.78);
    pincel.lineTo(Math.cos(a) * r * escala * 0.92, Math.sin(a) * r * escala * 0.92); pincel.stroke();
  }
  const ang = 0.75 * Math.PI + 1.5 * Math.PI * nave.velocidade;    // 📚 o PONTEIRO: ângulo depende da velocidade
  pincel.strokeStyle = '#ff9f1a'; pincel.lineWidth = 3.5 * escala;
  pincel.beginPath(); pincel.moveTo(0, 0); pincel.lineTo(Math.cos(ang) * r * escala * 0.72, Math.sin(ang) * r * escala * 0.72); pincel.stroke();
  pincel.restore();
  texto('VELOCIDADE', x, y + 36, 9, '#9aa3c7');
  texto(Math.round(nave.velocidade * 300) + ' km/s', x, y + 56, 12, CONFIG.corDoPainel);
}

function desenhaRadar() {
  const x = 320, y = 140, r = 80;
  moldura(x, y, r);
  pincel.save(); pincel.translate(px(x), py(y));
  pincel.strokeStyle = 'rgba(0,255,120,.35)'; pincel.lineWidth = 1.2;
  for (const anel of [0.33, 0.66, 0.95]) { pincel.beginPath(); pincel.arc(0, 0, r * escala * anel, 0, 6.3); pincel.stroke(); }   // círculos
  for (let i = 0; i < 22; i++) {                            // a "varredura" girando: 22 linhas, cada uma mais fraquinha
    const a = tempo / 25 - i * 0.05;
    pincel.strokeStyle = `rgba(0,255,120,${0.5 * (1 - i / 22)})`; pincel.lineWidth = 3 * escala;
    pincel.beginPath(); pincel.moveTo(0, 0); pincel.lineTo(Math.cos(a) * r * escala * 0.95, Math.sin(a) * r * escala * 0.95); pincel.stroke();
  }
  const alcance = 0.6 + nave.botaoSensor * 1.4;             // 📚 o botão SENSOR aumenta o alcance do radar
  pincel.fillStyle = '#ff3355';
  for (const ini of inimigos) {                             // cada inimigo vira uma bolinha: esquerda/direita = x, longe/perto = z
    const bx = (ini.x - camX) / 1500 * alcance * r * escala * 0.95;
    const by = -(ini.z / 3200) * alcance * r * escala * 0.95;
    if (Math.hypot(bx, by) < r * escala * 0.92) { pincel.beginPath(); pincel.arc(bx, by, 3.5 * escala, 0, 6.3); pincel.fill(); }
  }
  pincel.fillStyle = CONFIG.corDoPainel;                    // sua nave no centro (triângulo)
  pincel.beginPath(); pincel.moveTo(0, -6 * escala); pincel.lineTo(5 * escala, 5 * escala); pincel.lineTo(-5 * escala, 5 * escala); pincel.fill();
  pincel.restore();
  texto('RADAR', x, y + r - 12, 9, '#9aa3c7');
}

function desenhaBussola() {
  const x = 500, y = 135, r = 68;
  moldura(x, y, r);
  pincel.save(); pincel.translate(px(x), py(y));
  pincel.rotate(-rumo * Math.PI / 180);                     // 📚 o mostrador GIRA ao contrário do rumo (como uma bússola real)
  for (let grau = 0; grau < 360; grau += 15) {              // um tracinho a cada 15°
    const a = (grau - 90) * Math.PI / 180, comp = grau % 90 ? 0.1 : 0.22;
    pincel.strokeStyle = grau ? CONFIG.corDoPainel : '#ff4466'; pincel.lineWidth = grau % 90 ? 1.5 : 3;
    pincel.beginPath();
    pincel.moveTo(Math.cos(a) * r * escala * 0.92, Math.sin(a) * r * escala * 0.92);
    pincel.lineTo(Math.cos(a) * r * escala * (0.92 - comp), Math.sin(a) * r * escala * (0.92 - comp)); pincel.stroke();
  }
  ['N', 'L', 'S', 'O'].forEach((letra, i) => {              // Norte, Leste, Sul, Oeste
    const a = (i * 90 - 90) * Math.PI / 180;
    pincel.save(); pincel.translate(Math.cos(a) * r * escala * 0.58, Math.sin(a) * r * escala * 0.58);
    pincel.rotate(rumo * Math.PI / 180);                    // desgira a letra para ela ficar em pé
    pincel.fillStyle = i ? '#fff' : '#ff4466'; pincel.font = `bold ${15 * escala}px monospace`; pincel.textAlign = 'center'; pincel.textBaseline = 'middle';
    pincel.fillText(letra, 0, 0); pincel.restore();
  });
  pincel.restore();
  pincel.fillStyle = '#ff9f1a'; pincel.beginPath();         // a setinha fixa no topo
  pincel.moveTo(px(x), py(y - r + 4)); pincel.lineTo(px(x) - 6 * escala, py(y - r - 6)); pincel.lineTo(px(x) + 6 * escala, py(y - r - 6)); pincel.fill();
  texto(Math.round(rumo) + '°', x, y + 5, 14, '#fff');
}

function desenhaBotao(x, y, chave, nome) {                  // botão giratório: valor vai de 0 a 1 e gira de -135° a +135°
  const ang = (-135 + 270 * nave[chave]) * Math.PI / 180;
  moldura(x, y, 34);
  pincel.save(); pincel.translate(px(x), py(y));
  pincel.fillStyle = '#4a5378'; pincel.beginPath(); pincel.arc(0, 0, 22 * escala, 0, 6.3); pincel.fill();
  pincel.rotate(ang); pincel.strokeStyle = CONFIG.corDoPainel; pincel.lineWidth = 3 * escala; pincel.lineCap = 'round';
  pincel.beginPath(); pincel.moveTo(0, -4 * escala); pincel.lineTo(0, -20 * escala); pincel.stroke();   // o "risco" do botão
  pincel.restore();
  texto(nome, x, y + 50, 9, '#9aa3c7'); texto(Math.round(nave[chave] * 100) + '%', x, y + 4, 8, '#fff');
}

function desenhaAlavanca() {                                // 📚 slider: a posição do cabo vira o número "aceleracao"
  const x = 850, topo = 55, fundo = 235;
  pincel.fillStyle = '#07090f'; pincel.strokeStyle = '#4a5378'; pincel.lineWidth = 2;
  pincel.beginPath(); pincel.roundRect(px(x - 7), py(topo), 14 * escala, (fundo - topo) * escala, 7 * escala); pincel.fill(); pincel.stroke();
  const yCabo = fundo - (fundo - topo) * nave.aceleracao;
  pincel.fillStyle = '#8a93b8'; pincel.beginPath(); pincel.roundRect(px(x - 18), py(yCabo - 10), 36 * escala, 20 * escala, 5 * escala); pincel.fill();
  texto('ACELERAR', x, fundo + 14, 8, '#9aa3c7');
}

function desenhaInterruptor(x, y, ligado, nome, cor) {      // 📚 ligado/desligado = true/false (valor "booleano")
  lampada(x, y - 28, ligado, cor);
  pincel.fillStyle = '#10131f'; pincel.strokeStyle = '#4a5378'; pincel.lineWidth = 3 * escala;
  pincel.beginPath(); pincel.arc(px(x), py(y), 17 * escala, 0, 6.3); pincel.fill(); pincel.stroke();
  const ponta = ligado ? -16 : 16;                          // alavanca pra cima (ligado) ou pra baixo
  pincel.strokeStyle = '#c9d1f0'; pincel.lineWidth = 6 * escala; pincel.lineCap = 'round';
  pincel.beginPath(); pincel.moveTo(px(x), py(y)); pincel.lineTo(px(x), py(y + ponta)); pincel.stroke();
  texto(nome, x, y + 34, 9, '#9aa3c7');
}

// ─── 8.4 O PAINEL INTEIRO + A MOLDURA DA CABINE ───
function desenhaPainel() {
  const fundo = pincel.createLinearGradient(0, alturaVisao, 0, altura);   // degradê: do cinza-azulado ao preto
  fundo.addColorStop(0, '#252c48'); fundo.addColorStop(1, '#0b0d17');
  pincel.fillStyle = fundo;
  pincel.beginPath(); pincel.moveTo(0, alturaVisao); pincel.lineTo(largura * 0.2, alturaVisao - 4 * escala);
  pincel.lineTo(largura * 0.8, alturaVisao - 4 * escala); pincel.lineTo(largura, alturaVisao); pincel.lineTo(largura, altura); pincel.lineTo(0, altura); pincel.fill();
  pincel.fillStyle = `rgba(0,0,12,${0.55 * (1 - nave.luz)})`;             // 💡 LUZ DA CABINE: escurece o painel quando desligada...
  pincel.fillRect(0, alturaVisao - 6, largura, alturaPainel + 6);          // ...mas os instrumentos (desenhados depois) continuam brilhando
  const perto = inimigos.some((i) => i.z < 900);                           // algum inimigo perto? (some = "algum deles")
  if (perto) { pincel.strokeStyle = `rgba(255,40,70,${0.25 + 0.2 * Math.sin(tempo / 15)})`; pincel.lineWidth = 5; pincel.strokeRect(2, alturaVisao + 2, largura - 4, alturaPainel - 4); }

  desenhaVelocimetro(); desenhaRadar(); desenhaBussola();
  lampada(620, 50, perto, '#ff3355'); texto('ALERTA', 620, 70, 8, '#9aa3c7');
  barra(610, 92, 160, nave.escudo, '#00e5ff', 'ESCUDO');
  barra(610, 132, 160, nave.energia, '#ffd23f', 'ENERGIA');
  desenhaBotao(650, 200, 'botaoEscudo', 'REGEN.'); desenhaBotao(740, 200, 'botaoSensor', 'SENSOR');
  desenhaAlavanca();
  desenhaInterruptor(925, 75, nave.luzLigada, 'LUZ', '#ffd23f');
  desenhaInterruptor(925, 140, nave.vozLigada, 'VOZ', '#7dff6a');
  desenhaInterruptor(925, 205, nave.somLigado, 'SOM', '#7dff6a');
}

function desenhaCabine() {                                  // as colunas e o teto da nave, por cima do espaço
  const metal = pincel.createLinearGradient(0, 0, 0, alturaVisao);
  metal.addColorStop(0, '#04050a'); metal.addColorStop(1, '#1b2036');
  pincel.fillStyle = metal; pincel.strokeStyle = '#3b4263'; pincel.lineWidth = 2;
  const formas = [   // cada forma é uma lista de pontos [x, y]: teto, coluna esquerda, coluna direita
    [[0, 0], [largura, 0], [largura * 0.92, alturaVisao * 0.1], [largura * 0.08, alturaVisao * 0.1]],
    [[0, 0], [largura * 0.08, alturaVisao * 0.1], [largura * 0.2, alturaVisao], [0, alturaVisao]],
    [[largura, 0], [largura * 0.92, alturaVisao * 0.1], [largura * 0.8, alturaVisao], [largura, alturaVisao]]
  ];
  for (const pontosDaForma of formas) {
    pincel.beginPath();
    pontosDaForma.forEach(([x, y], i) => (i ? pincel.lineTo(x, y) : pincel.moveTo(x, y)));
    pincel.closePath(); pincel.fill(); pincel.stroke();
  }
  pincel.fillStyle = CONFIG.corDoPainel; pincel.font = `${Math.max(11, 13 * escala)}px monospace`; pincel.textAlign = 'center';
  pincel.fillText(`MISSÃO ${missao}  ·  ALVOS ${abates}/${6 + missao * 2}  ·  PONTOS ${pontos}`, centroX, alturaVisao * 0.065);   // placar no teto
  if (tempoLegenda > 0) {                                   // legenda do que o computador está falando
    pincel.globalAlpha = Math.min(1, tempoLegenda / 40); pincel.fillStyle = '#ffd23f';
    pincel.font = `bold ${Math.max(14, 18 * escala)}px monospace`; pincel.fillText('» ' + legenda.toUpperCase(), centroX, alturaVisao - 26);
    pincel.globalAlpha = 1;
  }
}


/* ════════════════════════════════════════════════════════════════
   9️⃣  CONTROLES — mouse, toque e teclado
   Um EVENTO é algo que acontece (clique, tecla...). Dizemos ao navegador:
   "quando isso acontecer, rode esta função".
   ════════════════════════════════════════════════════════════════ */
// Lista de peças clicáveis do painel (posições na grade 1000x260)
const CONTROLES = [
  { tipo: 'botao', chave: 'botaoEscudo', x: 650, y: 200, r: 36 },
  { tipo: 'botao', chave: 'botaoSensor', x: 740, y: 200, r: 36 },
  { tipo: 'alavanca', x: 850, topo: 55, fundo: 235 },
  { tipo: 'chave', chave: 'luzLigada', x: 925, y: 75 },
  { tipo: 'chave', chave: 'vozLigada', x: 925, y: 140 },
  { tipo: 'chave', chave: 'somLigado', x: 925, y: 205 }
];
let segurando = null;   // qual peça está sendo arrastada agora

const paraGrade = (e) => [(e.clientX - (largura / 2 - 500 * escala)) / escala, (e.clientY - alturaVisao) / escala];   // pixel → grade do painel

function acharPeca(e) {                                      // qual peça está debaixo do mouse?
  const [gx, gy] = paraGrade(e);
  return CONTROLES.find((c) => c.tipo === 'alavanca'
    ? Math.abs(gx - c.x) < 28 && gy > c.topo - 14 && gy < c.fundo + 14
    : Math.hypot(gx - c.x, gy - c.y) < (c.r || 26));
}
function moverPeca(c, e) {                                   // arrastando: transforma a posição do mouse em um valor de 0 a 1
  const [gx, gy] = paraGrade(e);
  if (c.tipo === 'botao') {
    const graus = Math.atan2(gx - c.x, -(gy - c.y)) * 180 / Math.PI;           // ângulo do mouse em volta do botão
    nave[c.chave] = (Math.max(-135, Math.min(135, graus)) + 135) / 270;        // converte -135..135 em 0..1
  }
  if (c.tipo === 'alavanca') nave.aceleracao = Math.max(0, Math.min(1, (c.fundo - gy) / (c.fundo - c.topo)));
}

tela.addEventListener('pointerdown', (e) => {                // apertou o mouse / encostou o dedo
  tela.setPointerCapture(e.pointerId);
  if (e.clientY > alturaVisao) {                             // clicou no painel
    const peca = acharPeca(e);
    if (!peca) return;
    if (peca.tipo === 'chave') { nave[peca.chave] = !nave[peca.chave]; bipe(300, 200, 0.08, 'square', 0.05); }   // ! inverte true/false
    else { segurando = peca; moverPeca(peca, e); }
  } else {                                                   // clicou no espaço: mirar e atirar
    mira.x = e.clientX; mira.y = e.clientY; atirando = true; atira();
  }
});
tela.addEventListener('pointermove', (e) => {
  if (segurando) moverPeca(segurando, e);
  else if (e.clientY < alturaVisao) { mira.x = e.clientX; mira.y = e.clientY; }
});
window.addEventListener('pointerup', () => { segurando = null; atirando = false; });
window.addEventListener('keydown', (e) => {                  // teclado: Espaço atira, L luz, V voz
  const tecla = e.key.toLowerCase();
  if (tecla === ' ') { e.preventDefault(); atirando = true; }
  if (tecla === 'l') nave.luzLigada = !nave.luzLigada;
  if (tecla === 'v') nave.vozLigada = !nave.vozLigada;
});
window.addEventListener('keyup', (e) => { if (e.key === ' ') atirando = false; });

document.getElementById('botaoIniciar').onclick = () => {
  audio = new (window.AudioContext || window.webkitAudioContext)();   // navegadores só liberam o som depois de um clique
  document.getElementById('inicio').hidden = true;
  jogando = true;
  falar(CONFIG.falas.inicio, true);
};


/* ════════════════════════════════════════════════════════════════
   🔟 O LOOP — o coração do jogo
   Roda ~60 vezes por segundo: atualiza as regras, depois desenha.
   É como um flipbook: 60 desenhos por segundo viram movimento!
   ════════════════════════════════════════════════════════════════ */
let ultimoQuadro = performance.now();
function loop(agora) {
  const dt = Math.min((agora - ultimoQuadro) / 16.667, 3);   // tempo desde o último quadro (assim o jogo roda igual em PC rápido ou lento)
  ultimoQuadro = agora;
  if (jogando) atualiza(dt);   // 1) regras  2) espaço  3) cabine  4) painel — a ordem é a das camadas
  desenhaEspaco();
  desenhaCabine();
  desenhaPainel();
  requestAnimationFrame(loop); // pede ao navegador: "chame o loop de novo no próximo quadro"
}
requestAnimationFrame(loop);

</script>
